name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run tests
        run: ./gradlew :backend:test --console=plain

  android:
    name: Android app
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # monotonically increasing, so installed frames accept the update
      CLOSEBY_VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Restore signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/closeby-release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/closeby-release.p12" >> "$GITHUB_ENV"

      - name: Restore Firebase config
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew -p android :app:assembleRelease --console=plain

      - name: Describe release
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/release/app-release*.apk apk/closeby.apk
          sha=$(sha256sum apk/closeby.apk | cut -d' ' -f1)
          printf '{"versionCode":%s,"versionName":"0.1.%s","sha256":"%s"}\n' \
            "$CLOSEBY_VERSION_CODE" "$CLOSEBY_VERSION_CODE" "$sha" > apk/version.json
          cat apk/version.json

      - name: Keep APK for the image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk
          path: apk/
          retention-days: 7

  desktop:
    name: Windows app
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri

      - name: Build installer
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npx tauri build
          mkdir -p ../desktop-dist
          cp src-tauri/target/release/bundle/nsis/*-setup.exe ../desktop-dist/CloseBy-setup.exe

      - name: Keep installer for the image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop
          path: desktop-dist/
          retention-days: 7

  image:
    name: Build container image
    # no image from a commit whose tests fail
    needs: [test, android, desktop]
    runs-on: ubuntu-latest
    outputs:
      published_tag: ${{ steps.published_tag.outputs.tag }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Fetch APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apk
          path: docker/apk

      - name: Fetch Windows installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop
          path: docker/desktop

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4 # v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export immutable image tag
        id: published_tag
        if: github.event_name != 'pull_request'
        run: echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Attest published image
        if: github.event_name != 'pull_request'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Update deployment image tag
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TARGET_REPOSITORY: axelcypher/gitops-homelab
      TARGET_ENV_FILE: apps/docker/closeby/prod.env
      TARGET_IMAGE_KEY: CLOSEBY_IMAGE_VERSION
      IMAGE_TAG: ${{ needs.image.outputs.published_tag }}
    steps:
      - name: Check out deployment repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: main
          token: ${{ secrets.CLOSEBY_DEPLOY_TOKEN }}
          path: deployment-repository

      - name: Update image tag
        working-directory: deployment-repository
        run: |
          test -f "$TARGET_ENV_FILE"
          sed -i "s|^${TARGET_IMAGE_KEY}=.*|${TARGET_IMAGE_KEY}=${IMAGE_TAG}|" "$TARGET_ENV_FILE"
          grep -q "^${TARGET_IMAGE_KEY}=${IMAGE_TAG}$" "$TARGET_ENV_FILE"

      - name: Commit and push
        working-directory: deployment-repository
        run: |
          git add -- "$TARGET_ENV_FILE"
          if git diff --cached --quiet; then
            echo "already at $IMAGE_TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: deploy CloseBy ${GITHUB_SHA::12}"
          git push origin HEAD:main
