[package]
name = "closeby-desktop"
version = "0.1.0"
description = "Windows shell for the CloseBy web client: tray, autostart, rings on incoming calls"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.6.0"
tauri-plugin-single-instance = "=2.5.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
